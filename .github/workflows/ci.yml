name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Одновременные прогоны для одной ветки отменяют друг друга
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Типы, тесты, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Проверка содержимого сборки
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.json
          test -f dist/icons/icon-512.png
          echo "Сборка на месте: $(du -h dist/index.html | cut -f1)"
